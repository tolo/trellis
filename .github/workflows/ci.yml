name: CI

# Gates main and every feature branch before a release tag can be cut.
#
# Until this existed, nothing ran `dart analyze` or `dart test` on push: the
# first automated check fired at tag time (publish.yml, release-binaries.yml),
# so a broken merge surfaced only once a release was already in flight, and the
# binary pipeline would build whatever happened to be on main (TD-010).
#
# Runs the tasks in mise.toml, which call the melos scripts declared in the root
# pubspec (ADR-007) rather than a bare `dart analyze`/`dart test`. In a Dart
# workspace those root commands only cover the root `test/` directory — the
# ~1500 package tests are not picked up, so a hand-rolled gate would pass while
# testing almost nothing. Developers and agents run the same tasks locally.
#
# One job, two tiers:
#   * `mise run check` — lint (gallery, analyze, format) and unit tests, on
#     every feature-branch push. Fast feedback.
#   * `mise run check-full` — the same lint plus the E2E-tagged suites, on main
#     and on demand. They generate projects, run `pub get` and `analyze` inside
#     each, activate the dart_frog CLI, and boot real servers.
#
# Vendored font provenance runs on every push too, but from font-provenance.yml
# rather than from here (TD-044): it is the only check that needs the network,
# and everything in THIS workflow blocks the release tag (below), so an upstream
# outage must not be able to hold up a publish. Keep it out of this file.
#
# This workflow is the release gate: publish.yml and release-binaries.yml
# (triggered by the `vX.Y.Z` tag push) refuse to run unless THIS workflow
# concluded `success` for the tagged commit on main — release-gate.yml queries
# the run for that SHA (tool/require_green_ci.sh) and waits for it if it is
# still in flight. Renaming this file breaks that lookup (it keys on `ci.yml`).
# The concurrency rule below never cancels a *running* main check; note GitHub
# still cancels a *pending* (queued, not started) run when a newer one queues
# behind it, so a release commit's run can end `cancelled` if two more pushes
# to main follow quickly — the gate then fails and the fix is to re-run that CI
# run, then re-run the release workflow. Release procedure:
# dev/guidelines/RELEASE-RUNBOOK.md.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same feature-branch ref; the newest commit
# is the one that matters. NOT on main: a follow-up push there must not cancel
# the run that gates the release commit, or that commit ends up with no
# completed check at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: mise ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'check-full' || 'check' }}
    runs-on: ubuntu-latest
    # The root browser suite was still completing checks at the 20-minute job limit.
    timeout-minutes: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 60 || 30 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Installs mise plus the Dart and Node versions pinned in mise.toml (why
      # Dart is pinned and why Node is load-bearing are noted there).
      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      # The rendered checks - the theme reflow sweep and the visual baseline
      # comparator - drive headless Chrome over the DevTools protocol
      # (test/browser_reflow_probe.dart). They are the only checks that can see
      # a layout defect at all: 0.11 shipped a hero with 205px of dead space, a
      # mobile panel pushing content off the fold and a marker band clipping its
      # own text, none of which is visible in the stylesheet and all of which
      # passed a green suite. Both skip when no Chrome binary is found and
      # `requireChromeInCi` turns that skip into a failure when CI=true, so this
      # step is what stops them becoming a silent hole.
      # ubuntu-latest ships google-chrome-stable; assert it rather than trust
      # the image, and log the version because the baselines record the Chrome
      # that produced them and a browser upgrade can legitimately move layout.
      - name: Check Chrome is present
        run: google-chrome --version

      # Activates melos 7.4.0 (the root pubspec dev_dependency) and bootstraps
      # the workspace.
      - name: Setup
        run: mise run setup

      # `visual` and `ui-gate` stay out of both tiers: they are local release
      # gates (ADR-012, TD-035) run by `mise run release-gate` on the
      # baseline-authoring host.
      - name: Check
        run: mise run ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'check-full' || 'check' }}
