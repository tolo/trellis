name: CI

# Gates main and every feature branch before a release tag can be cut.
#
# Until this existed, nothing ran `dart analyze` or `dart test` on push: the
# first automated check fired at tag time (publish.yml, release-binaries.yml),
# so a broken merge surfaced only once a release was already in flight, and the
# binary pipeline would build whatever happened to be on main (TD-010).
#
# Runs the melos scripts declared in the root pubspec (ADR-007) rather than a
# bare `dart analyze`/`dart test`. In a Dart workspace those root commands only
# cover the root `test/` directory — the ~1500 package tests are not picked up,
# so a hand-rolled gate would pass while testing almost nothing.
#
# Three jobs:
#   * check — analyze + format + unit tests, on every push. Fast feedback.
#   * fonts — re-derives every vendored WOFF2 from its pinned google/fonts blob
#             and fails on drift. Independent of `check` and runs beside it, so
#             it costs no wall-clock; it is the only check that ties the shipped
#             font bytes to an upstream provenance rather than to their own
#             shape. Per-push rather than release-time on purpose (TD-029): the
#             point is to name the commit that changed the bytes.
#   * e2e   — the E2E-tagged suites, on main and on demand. They generate
#             projects, run `pub get` and `analyze` inside each, activate the
#             dart_frog CLI, and boot real servers.
# Feature branches get the fast tier; main additionally gets E2E.
#
# This workflow is the release gate: publish.yml and release-binaries.yml
# (triggered by the `vX.Y.Z` tag push) refuse to run unless THIS workflow
# concluded `success` for the tagged commit on main — release-gate.yml queries
# the run for that SHA (tool/require_green_ci.sh) and waits for it if it is
# still in flight. Renaming this file breaks that lookup (it keys on `ci.yml`).
# The concurrency rule below never cancels a *running* main check; note GitHub
# still cancels a *pending* (queued, not started) run when a newer one queues
# behind it, so a release commit's run can end `cancelled` if two more pushes
# to main follow quickly — the gate then fails and the fix is to re-run that CI
# run, then re-run the release workflow. Release procedure:
# dev/guidelines/RELEASE-RUNBOOK.md.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same feature-branch ref; the newest commit
# is the one that matters. NOT on main: a follow-up push there must not cancel
# the run that gates the release commit, or that commit ends up with no
# completed check at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Melos scripts use `exec:`, which shells out to `melos` on PATH — `dart run
# melos` is not enough. Constraint matches the root pubspec dev_dependency.
#
# The Dart SDK is pinned because `format:check` is a hard gate and formatter
# output is SDK-versioned: an unpinned `stable` would let a Dart release turn
# CI red on an unrelated commit (that is how 22 files drifted in the first
# place). Bump deliberately, together with the packages' `sdk:` constraints.
env:
  MELOS_VERSION: ^7.4.0
  DART_SDK: 3.13.0

jobs:
  check:
    name: Analyze, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      # Several root-suite checks shell out to node: the theme client-behaviour
      # harness (lattice/folio/search), Meadow's mobile-menu DOM harness, and the
      # WOFF2/brotli fvar reader behind the @font-face axis contract. Each skips
      # when node is missing, so without this step a runner image that drops node
      # would report "All tests passed" with those assertions never executed.
      # `_requireNodeInCi` turns that skip into a failure when CI=true, so this
      # step is load-bearing rather than advisory - do not remove it while
      # reasoning about only one of the three consumers.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The rendered checks - the theme reflow sweep and the visual baseline
      # comparator - drive headless Chrome over the DevTools protocol
      # (test/browser_reflow_probe.dart). They are the only checks that can see
      # a layout defect at all: 0.11 shipped a hero with 205px of dead space, a
      # mobile panel pushing content off the fold and a marker band clipping its
      # own text, none of which is visible in the stylesheet and all of which
      # passed a green suite. Both skip when no Chrome binary is found and
      # `requireChromeInCi` turns that skip into a failure when CI=true, so this
      # step is what stops them becoming the hole the Node steps above describe.
      # ubuntu-latest ships google-chrome-stable; assert it rather than trust
      # the image, and log the version because the baselines record the Chrome
      # that produced them and a browser upgrade can legitimately move layout.
      - name: Check Chrome is present
        run: google-chrome --version

      - name: Activate melos
        run: |
          dart pub global activate melos "$MELOS_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: dart pub get

      - name: Check generated theme gallery
        run: dart run tool/generate_theme_gallery.dart --check

      # melos `analyze` script: `dart analyze --fatal-infos` per package.
      - name: Analyze
        run: melos run --no-select analyze

      # Formatting is a gate, not advice: the workspace carried 22 drifted
      # files before this job existed.
      - name: Check formatting
        run: melos run --no-select format:check

      # Excludes @Tags(['e2e']); the e2e job covers those.
      - name: Unit tests
        run: melos exec --dir-exists=test -- dart test --exclude-tags=e2e

      # The workspace ROOT is not a melos member, so `melos exec` skips it —
      # yet it carries the release-distribution contract test, the docs-site
      # link check, tool/ (build_release, Homebrew/Scoop renderers), and the two
      # rendered suites (theme_contract_test, visual_baseline_test). That is
      # exactly the pipeline TD-010 said was ungated, so cover it here.
      #
      # The rendered suites run on every push rather than on main only. They are
      # the slowest part of this job (a browser, a build per theme, ~100
      # measurements), but restricting them to main would put them behind the
      # merge that is exactly the thing they exist to gate: every 0.11 rendering
      # defect lived on a feature branch for weeks before anyone rendered it.
      # No tag exclusion: the visual comparator is what gates the
      # transform/opacity/border-radius class of regression, and nothing else in
      # the workspace sees it at all. Its baselines are committed per platform
      # (test/visual_baselines/<theme>.linux.json is the set this job compares
      # against; the .macos.json set is what a maintainer runs locally), so an
      # appearance change has to be re-recorded on both before this goes green
      # again - see the recording recipe in test/visual_baseline_test.dart.
      # Same command as tool/release.sh's root gate, deliberately.
      - name: Root workspace tests
        run: dart test

      - name: Check root formatting
        run: dart format --output=none --set-exit-if-changed tool test

  # `tool/subset_fonts.py --verify` re-runs instancer + subset for all eleven files
  # and compares SHA-256 against the committed bytes, so a hand-edited or
  # hand-replaced font fails here. It needs the network (the pinned blobs are
  # fetched from raw.githubusercontent.com, ~2.6 MB); `fetch()` retries three
  # times with backoff so a dropped connection does not redden an unrelated
  # commit. Python and fontTools/brotli are pinned because the output hash is
  # toolchain-versioned - the same reason DART_SDK is pinned above.
  fonts:
    name: Vendored font provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install the pinned subsetting toolchain
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet 'fonttools==4.63.0' 'brotli==1.2.0'

      - name: Verify every vendored WOFF2 reproduces from its pinned upstream
        run: .venv/bin/python tool/subset_fonts.py --verify

  e2e:
    name: E2E suites
    # Feature branches stop at `check`; main pays for the full suite.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Activate melos
        run: |
          dart pub global activate melos "$MELOS_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: dart pub get

      # The dart_frog E2E suites activate this themselves when missing; doing it
      # up front keeps the cost out of the per-test timeouts.
      - name: Activate dart_frog CLI
        run: dart pub global activate dart_frog_cli 1.2.6

      # Full suite, not `--tags=e2e`: `dart test --tags=<tag>` exits 79 in a
      # package where nothing carries the tag, and only trellis_cli has E2E
      # tests. Re-running the unit tests here is cheap next to the E2E cost.
      - name: Full suite
        run: melos exec --dir-exists=test -- dart test
