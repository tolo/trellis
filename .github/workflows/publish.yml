name: Publish to pub.dev

# Publishes the whole Trellis SDK in lockstep when a release tag is pushed.
#
# Uses pub.dev's OIDC automated publishing — no API tokens or secrets are
# stored: each job mints a short-lived OIDC token (`id-token: write`) that
# pub.dev validates against the tag. Every package must have automated
# publishing enabled on its pub.dev Admin tab (repository `tolo/trellis`,
# tag pattern `v{{version}}`) for its job to succeed.
#
# Lockstep (ADR-009): all packages share one version, so a single `vX.Y.Z` tag
# matches `v{{version}}` for every package. Cut releases with tool/release.sh
# and push the tag it prints — see dev/guidelines/RELEASE-RUNBOOK.md.
#
# Nothing publishes unless `ci-gate` passes: CI must be green for the tagged
# commit and the commit must be on main (release-gate.yml). pub.dev cannot
# unpublish, so this is the last rail before an irreversible step.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  ci-gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: ${{ matrix.package }}
    needs: ci-gate
    strategy:
      # Publish every package even if one fails — pub.dev tolerates a satellite
      # whose core dependency is still mid-publish, and a failed job can be
      # re-run independently.
      fail-fast: false
      matrix:
        package:
          - trellis
          - trellis_shelf
          - trellis_css
          - trellis_site
          - trellis_dev
          - trellis_relic
          - trellis_cli
          - trellis_dart_frog
    permissions:
      id-token: write # Mint the OIDC token pub.dev validates; no secret needed.
    # Pinned to the major tag (currently == v1.7.2) on purpose: a moving `@v1`
    # auto-receives upstream patches, including the eventual Node 20 -> 24 bump.
    # The "Node.js 20 is deprecated" warning in the logs comes from the
    # `dart-lang/setup-dart` action pinned *inside* this reusable workflow, not
    # from anything here — it is upstream's to fix and is currently harmless
    # (jobs are force-run on Node 24). Tracked in dev/state/TECH-DEBT-BACKLOG.md.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ matrix.package }}
