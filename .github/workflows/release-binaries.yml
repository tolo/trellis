name: Release Binaries
# Action-update process: to bump a pinned action, re-resolve the tag to its current SHA with
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
# then update both the SHA and the trailing # vX comment on the uses: line.
#
# Compiles the trellis_cli AOT binary for five targets and attaches them to the
# GitHub Release, then updates the Homebrew tap and the Scoop bucket
# (tolo/scoop-trellis). Triggered by the same `vX.Y.Z` tag that drives publish.yml
# (pub.dev). The two workflows are independent — this one only touches the
# Release + tap/bucket, never pub.dev.
#
# Both the Homebrew tap and the Scoop bucket updates are skipped automatically when
# TAP_TOKEN is not configured.
#
# Nothing runs unless `ci-gate` passes: CI must be green for the tagged commit
# and the commit must be on main (release-gate.yml). The final `verify` job
# checks the published result end to end (pub.dev, Release assets, taps) so a
# half-published release is visible in this run, not discovered later.
# See dev/guidelines/RELEASE-RUNBOOK.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  HOMEBREW_TAP_REPO: tolo/homebrew-trellis
  SCOOP_TAP_REPO: tolo/scoop-trellis
  # Pinned so release binaries are reproducible, and the SAME pin as ci.yml so
  # the analyze/format/test evidence CI produced applies to the toolchain that
  # compiles the release. The root contract test fails if the two drift.
  DART_SDK: 3.13.0

jobs:
  ci-gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      actions: read
      contents: read

  version:
    name: Resolve version
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Read and verify version
        id: read
        run: |
          # read_version.dart cross-checks pubspec `version:` against the cliVersion
          # constant (lockstep, ADR-009) and throws on drift; only the tag match is left to bash.
          VERSION=$(dart run tool/read_version.dart)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match trellis_cli version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Single creation point avoids the concurrent-create race from five matrix
          # jobs; kept a draft until every artifact lands so users never see a partial
          # release. `|| create` makes the step idempotent across job re-runs.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Trellis SDK $GITHUB_REF_NAME"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-15
            target: macos-arm64
          - runs_on: macos-15-intel
            target: macos-x64
          - runs_on: ubuntu-latest
            target: linux-x64
          - runs_on: ubuntu-latest
            target: linux-arm64
          - runs_on: windows-latest
            target: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Build release artifact
        run: dart run tool/build_release.dart
        env:
          TRELLIS_RELEASE_TARGET: ${{ matrix.target }}

      # linux-arm64 is cross-compiled on an x64 runner, so its binary cannot
      # execute here; assert at least the ELF arch instead of running it.
      - name: Assert cross-compiled arch (linux-arm64)
        if: matrix.target == 'linux-arm64'
        run: file build/stage/trellis | grep -q aarch64

      # Smoke-test the compiled binary before upload: it must prove the core SSG
      # loop works with the Dart SDK stripped from PATH (PATH=/usr/bin:/bin, and
      # we assert `dart` is unresolvable), so the AOT binary can't silently lean
      # on a host SDK. The `blog` template was chosen because it is fully offline
      # — `create` writes embedded-constant files (no git clone, no network) and
      # `build` runs entirely on packages compiled into the binary (no `dart pub
      # get` for the generated project). Verified locally against the AOT binary
      # from a clean dir outside the workspace. linux-arm64 is cross-compiled on
      # an x64 runner, so its binary cannot execute here — skipped; the other
      # four targets cover the AOT code paths.
      - name: Smoke test (unix)
        if: runner.os != 'Windows' && matrix.target != 'linux-arm64'
        run: |
          set -euo pipefail
          BIN="$PWD/build/stage/trellis"
          WORK="$RUNNER_TEMP/smoke"
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          export PATH=/usr/bin:/bin
          if command -v dart >/dev/null 2>&1; then echo "dart still on PATH; strip failed" >&2; exit 1; fi
          VER=$("$BIN" --version)
          echo "version output: $VER"
          case "$VER" in
            *"${GITHUB_REF_NAME#v}"*) : ;;
            *) echo "--version '$VER' does not contain tag ${GITHUB_REF_NAME#v}" >&2; exit 1 ;;
          esac
          "$BIN" create smoke_site --template blog
          cd smoke_site
          "$BIN" build
          test -f output/index.html
          echo "Smoke test passed: output/index.html produced."

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$PWD\build\stage\trellis.exe"
          $work = "$env:RUNNER_TEMP\smoke"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null
          Set-Location $work
          # Strip the Dart SDK from PATH so the AOT binary can't lean on a host SDK.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command dart -ErrorAction SilentlyContinue) { Write-Error 'dart still on PATH; strip failed' }
          $ver = & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "trellis --version exited $LASTEXITCODE" }
          Write-Host "version output: $ver"
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($ver -notmatch [regex]::Escape($tag)) {
            Write-Error "--version '$ver' does not contain tag $tag"
          }
          & $bin create smoke_site --template blog
          if ($LASTEXITCODE -ne 0) { throw "trellis create exited $LASTEXITCODE" }
          Set-Location smoke_site
          & $bin build
          if ($LASTEXITCODE -ne 0) { throw "trellis build exited $LASTEXITCODE" }
          if (-not (Test-Path 'output/index.html')) { Write-Error 'output/index.html missing' }
          Write-Host 'Smoke test passed: output/index.html produced.'

      - name: Upload release asset
        # bash on every runner (Windows included) so the glob expands the same way;
        # --clobber makes re-runs idempotent against the draft release.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" build/trellis-v*-${{ matrix.target }}.* --clobber

  checksums:
    name: Publish aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release checksum assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-checksums
          gh release download "$TAG_NAME" --pattern '*.sha256' --dir release-checksums

      - name: Build aggregate SHA256SUMS.txt
        run: |
          cat release-checksums/*.sha256 | LC_ALL=C sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Flip the draft to public only after every binary + the checksums file
          # exist, so there is never a partial public release; asset URLs take their
          # final releases/download/<tag>/ form once published. make_latest=legacy
          # asks GitHub to choose Latest by release date + semantic version, so a
          # later backport tag (e.g. v0.7.x after v0.8.0) cannot hijack the alias.
          API_URL=$(gh release view "$GITHUB_REF_NAME" --json apiUrl --jq .apiUrl)
          gh api --method PATCH "$API_URL" -F draft=false -f make_latest=legacy

  homebrew:
    name: Update Homebrew tap
    needs: [version, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Download platform checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p tap-checksums
          gh release download "$TAG_NAME" --pattern 'trellis-v*-macos-*.tar.gz.sha256' --dir tap-checksums
          gh release download "$TAG_NAME" --pattern 'trellis-v*-linux-*.tar.gz.sha256' --dir tap-checksums

      - name: Render formula
        run: |
          dart run tool/render_homebrew_formula.dart \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --checksums-dir tap-checksums \
            --output trellis.rb
          cat trellis.rb

      - name: Publish formula to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not configured; skipping Homebrew tap update." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula
          cp trellis.rb tap-repo/Formula/trellis.rb
          cd tap-repo
          git add Formula/trellis.rb
          if git diff --cached --quiet; then
            echo "Formula already current for ${VERSION}; nothing to push."
          else
            git commit -m "trellis ${VERSION}"
            git push
          fi

  scoop:
    name: Update Scoop bucket
    needs: [version, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Install dependencies
        run: dart pub get

      - name: Download Windows checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p tap-checksums
          gh release download "$TAG_NAME" --pattern 'trellis-v*-windows-x64.zip.sha256' --dir tap-checksums

      - name: Render manifest
        run: |
          dart run tool/render_scoop_manifest.dart \
            --version "${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --checksums-dir tap-checksums \
            --output trellis.json
          cat trellis.json

      - name: Publish manifest to bucket
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not configured; skipping Scoop bucket update." >&2
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${SCOOP_TAP_REPO}.git" bucket-repo
          mkdir -p bucket-repo/bucket
          cp trellis.json bucket-repo/bucket/trellis.json
          cd bucket-repo
          git add bucket/trellis.json
          if git diff --cached --quiet; then
            echo "Manifest already current for ${VERSION}; nothing to push."
          else
            git commit -m "trellis ${VERSION}"
            git push
          fi

  verify:
    name: Verify release is fully published
    needs: [version, homebrew, scoop]
    runs-on: ubuntu-latest
    # publish.yml (pub.dev) runs in parallel with this workflow and is not a
    # dependency, so give it time; the wait is bounded and the job goes red if
    # anything is still missing — a half-published release shows up here.
    timeout-minutes: 30
    steps:
      - name: Checkout (tool/ only)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          sparse-checkout: tool

      - name: Verify pub.dev, GitHub Release assets, and taps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          # The tap jobs skip themselves without TAP_TOKEN; do not report that as a failure.
          HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
        run: |
          TAP_FLAG=""
          if [ "$HAS_TAP_TOKEN" != "true" ]; then TAP_FLAG="--no-taps"; fi
          # shellcheck disable=SC2086 # TAP_FLAG is empty or one flag
          tool/verify_release.sh "$VERSION" --wait 20 $TAP_FLAG
