<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-labelledby="t d">
  <title id="t">Trellis SDK package dependency graph</title>
  <desc id="d">Arrows point from a package to the packages it depends on. trellis_cli depends on trellis_site and trellis_css; trellis_site on trellis_css and trellis; trellis_dart_frog on trellis_shelf and trellis; trellis_css, trellis_dev, trellis_shelf and trellis_relic on trellis. Core trellis depends on no SDK package. Edited by hand from the pubspecs; keep it in step with them.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f7f9; stroke: #5b6472; stroke-width: 1.5; }
    .core { fill: #e8eefc; stroke: #2f5bd3; stroke-width: 2; }
    .name { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1c2230; }
    .ext { font: 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5b6472; }
    .title { font: 600 20px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1c2230; }
    .note { font: 13px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5b6472; }
    .edge { fill: none; stroke: #5b6472; stroke-width: 1.5; }
    .edge-new { fill: none; stroke: #c2410c; stroke-width: 2.5; }
    .label-new { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c2410c; }
    .head { fill: #5b6472; }
    .head-new { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14171d; }
      .box { fill: #1e232c; stroke: #8a93a3; }
      .core { fill: #1b2742; stroke: #7da2ff; }
      .name, .title { fill: #e6e9ef; }
      .ext, .note { fill: #9aa3b2; }
      .edge { stroke: #8a93a3; }
      .head { fill: #8a93a3; }
      .edge-new { stroke: #fb923c; }
      .head-new, .label-new { fill: #fb923c; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head-new" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1080" height="580"/>
  <text class="title" x="30" y="40">Trellis SDK – package dependencies (0.13)</text>

  <!-- edges: package → dependency -->
  <path class="edge" d="M225,130 L130,198" marker-end="url(#a)"/>
  <path class="edge" d="M225,130 L320,198" marker-end="url(#a)"/>
  <path class="edge-new" d="M240,230 L212,230" marker-end="url(#an)"/>
  <text class="label-new" x="226" y="190" text-anchor="middle">new in 0.13</text>
  <path class="edge" d="M750,130 L750,198" marker-end="url(#a)"/>
  <path class="edge" d="M660,115 L645,115 L645,380 L587,428" marker-end="url(#a)"/>
  <path class="edge" d="M120,260 L428,428" marker-end="url(#a)"/>
  <path class="edge" d="M330,260 L478,428" marker-end="url(#a)"/>
  <path class="edge" d="M540,260 L540,428" marker-end="url(#a)"/>
  <path class="edge" d="M750,260 L622,428" marker-end="url(#a)"/>
  <path class="edge" d="M960,260 L662,428" marker-end="url(#a)"/>

  <!-- tooling and framework adapters -->
  <rect class="box" x="135" y="70" width="180" height="60" rx="8"/>
  <text class="name" x="225" y="96" text-anchor="middle">trellis_cli</text>
  <text class="ext" x="225" y="116" text-anchor="middle">args, shelf, shelf_static</text>

  <rect class="box" x="660" y="70" width="180" height="60" rx="8"/>
  <text class="name" x="750" y="96" text-anchor="middle">trellis_dart_frog</text>
  <text class="ext" x="750" y="116" text-anchor="middle">dart_frog, shelf</text>

  <!-- packages on core -->
  <rect class="box" x="30" y="200" width="180" height="60" rx="8"/>
  <text class="name" x="120" y="226" text-anchor="middle">trellis_css</text>
  <text class="ext" x="120" y="246" text-anchor="middle">sass, html</text>

  <rect class="box" x="240" y="200" width="180" height="60" rx="8"/>
  <text class="name" x="330" y="226" text-anchor="middle">trellis_site</text>
  <text class="ext" x="330" y="246" text-anchor="middle">markdown, yaml, highlight, html</text>

  <rect class="box" x="450" y="200" width="180" height="60" rx="8"/>
  <text class="name" x="540" y="226" text-anchor="middle">trellis_dev</text>
  <text class="ext" x="540" y="246" text-anchor="middle">shelf</text>

  <rect class="box" x="660" y="200" width="180" height="60" rx="8"/>
  <text class="name" x="750" y="226" text-anchor="middle">trellis_shelf</text>
  <text class="ext" x="750" y="246" text-anchor="middle">shelf, crypto</text>

  <rect class="box" x="870" y="200" width="180" height="60" rx="8"/>
  <text class="name" x="960" y="226" text-anchor="middle">trellis_relic</text>
  <text class="ext" x="960" y="246" text-anchor="middle">relic</text>

  <!-- core -->
  <rect class="core" x="400" y="430" width="280" height="64" rx="8"/>
  <text class="name" x="540" y="457" text-anchor="middle">trellis (core engine)</text>
  <text class="ext" x="540" y="478" text-anchor="middle">html, args, path, matcher, string_scanner</text>

  <text class="note" x="30" y="548">Arrows point to a dependency. Grey text lists each package's third-party runtime dependencies.</text>
  <text class="note" x="30" y="568">Core depends on no SDK package; CSS, SSG and dev tools never become dependencies of core (ADR-004).</text>
</svg>
