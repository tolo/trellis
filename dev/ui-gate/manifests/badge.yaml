{
  "name": "badge",
  "page": "/components/badge",
  "root": "#component",
  "elements": {
    "primary": ".trellis-badge",
    "destructive": ".trellis-badge-variant-destructive"
  },
  "states": {
    "default": [],
    "dark": [
      {
        "eval": "document.documentElement.classList.add('dark')"
      },
      {
        "wait": 200
      }
    ]
  },
  "keyboard": [
    {
      "focus": "#before"
    },
    {
      "press": "Tab"
    },
    {
      "expect": {
        "expression": "document.activeElement.id",
        "equals": "after"
      }
    }
  ],
  "semantics": [
    {
      "expression": "document.querySelector('.trellis-badge').tagName==='SPAN'",
      "equals": true
    }
  ],
  "htmx": {
    "region": "#demo",
    "swap": [
      {
        "click": "#swap"
      }
    ],
    "navigate": [
      {
        "click": "#navigate"
      }
    ]
  },
  "instances": [
    "#component"
  ],
  "provenance": [
    {
      "file": "../../../packages/trellis_ui/vendor/shadcn/shadcn@4.23.0/LICENSE.md",
      "license": "MIT"
    }
  ]
}
