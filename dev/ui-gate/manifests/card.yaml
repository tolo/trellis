{
  "name": "card",
  "page": "/components/card",
  "root": "#component",
  "elements": {
    "primary": ".trellis-card"
  },
  "states": {
    "default": [],
    "dark": [
      {
        "eval": "document.documentElement.classList.add('dark')"
      },
      {
        "wait": 200
      }
    ]
  },
  "keyboard": [
    {
      "focus": "#before"
    },
    {
      "press": "Tab"
    },
    {
      "expect": {
        "expression": "document.activeElement.id",
        "equals": "after"
      }
    }
  ],
  "semantics": [
    {
      "expression": "document.querySelector('.trellis-card h2')!==null",
      "equals": true
    }
  ],
  "htmx": {
    "region": "#demo",
    "swap": [
      {
        "click": "#swap"
      }
    ],
    "navigate": [
      {
        "click": "#navigate"
      }
    ]
  },
  "instances": [
    "#component"
  ],
  "provenance": [
    {
      "file": "../../../packages/trellis_ui/vendor/shadcn/shadcn@4.21.1/LICENSE.md",
      "license": "MIT"
    }
  ],
  "distinct": [
    [
      ".trellis-card-header",
      ".trellis-card-content",
      ".trellis-card-footer"
    ]
  ]
}
