{
  "name": "radio",
  "page": "/components/radio",
  "root": "#component",
  "elements": {
    "primary": "#primary"
  },
  "states": {
    "default": [],
    "dark": [
      {
        "eval": "document.documentElement.classList.add('dark')"
      },
      {
        "wait": 200
      }
    ],
    "hover": [
      {
        "hover": "#primary"
      },
      {
        "wait": 200
      }
    ],
    "focus-visible": [
      {
        "focus": "#primary"
      },
      {
        "wait": 200
      }
    ],
    "disabled": [
      {
        "eval": "document.querySelector(\"#primary\").disabled = true"
      },
      {
        "wait": 200
      }
    ],
    "invalid": [
      {
        "eval": "document.querySelector(\"#primary\").setAttribute(\"aria-invalid\",\"true\")"
      },
      {
        "wait": 200
      }
    ],
    "checked": [
      {
        "eval": "document.querySelector(\"#primary\").checked = true"
      },
      {
        "wait": 200
      }
    ]
  },
  "keyboard": [
    {
      "focus": "#primary"
    },
    {
      "press": " "
    },
    {
      "expect": {
        "expression": "document.querySelector(\"#primary\").checked",
        "equals": true
      }
    },
    {
      "press": "Tab"
    },
    {
      "expect": {
        "expression": "document.activeElement !== document.querySelector(\"#primary\")",
        "equals": true
      }
    }
  ],
  "semantics": [
    {
      "expression": "document.querySelector('fieldset legend')!==null && document.querySelector('#primary').type==='radio'",
      "equals": true
    }
  ],
  "htmx": {
    "region": "#demo",
    "swap": [
      {
        "click": "#swap"
      }
    ],
    "navigate": [
      {
        "click": "#navigate"
      }
    ]
  },
  "instances": [
    "#component"
  ],
  "provenance": [
    {
      "file": "../../../packages/trellis_ui/vendor/shadcn/shadcn@4.21.1/LICENSE.md",
      "license": "MIT"
    }
  ]
}
