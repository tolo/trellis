name: trellis_site
version: 0.10.0
description: >-
  Static site generator for Trellis — Markdown content, Trellis templates,
  Hugo-inspired conventions.
repository: https://github.com/tolo/trellis/tree/main/packages/trellis_site
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  # Build-time syntax highlighting (ADR-010): pure-Dart highlight.js port that
  # emits `.hljs-*` HTML. Build-time only — never shipped to the browser.
  highlight: ^0.7.0
  # DOM parse/serialize for build-time code highlighting (entity round-tripping).
  html: ^0.15.6
  markdown: ^7.3.0
  path: ^1.9.0
  trellis: ^0.10.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # Compiles the generated SASS bridge through the real compiler in
  # theme_sass_integration_test.dart, to catch quoting bugs the plain string
  # assertions on _theme_params.scss content can't see.
  trellis_css: ^0.10.0
