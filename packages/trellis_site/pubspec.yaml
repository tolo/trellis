name: trellis_site
version: 0.9.0
description: >-
  Static site generator for Trellis — Markdown content, Trellis templates,
  Hugo-inspired conventions.
repository: https://github.com/tolo/trellis/tree/main/packages/trellis_site
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  markdown: ^7.3.0
  path: ^1.9.0
  trellis: ^0.9.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # Compiles the generated SASS bridge through the real compiler in
  # theme_sass_integration_test.dart, to catch quoting bugs the plain string
  # assertions on _theme_params.scss content can't see.
  trellis_css: ^0.9.0
