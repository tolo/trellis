<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>pagination</title></head><body>
<nav tl:fragment="pagination(pages, previous, next, ...attrs)" data-slot="pagination" class="trellis-pagination" aria-label="Pagination" tl:attrs="${attrs}"><ul data-slot="pagination-content" class="trellis-pagination-content"><li data-slot="pagination-item"><a tl:if="${previous}" tl:href="${previous}" data-slot="pagination-link" class="trellis-pagination-link trellis-pagination-previous trellis-button trellis-button-variant-ghost trellis-button-size-default" aria-label="Previous page"><span class="trellis-pagination-previous-text">Previous</span></a><span tl:unless="${previous}" aria-disabled="true" class="trellis-pagination-previous">Previous</span></li><li tl:each="page : ${pages}" data-slot="pagination-item"><span tl:if="${page.ellipsis}" data-slot="pagination-ellipsis" class="trellis-pagination-ellipsis" aria-hidden="true">…</span><a tl:unless="${page.ellipsis}" data-slot="pagination-link" class="trellis-pagination-link trellis-button trellis-button-size-icon" tl:classappend="${page.current ? 'trellis-button-variant-outline' : 'trellis-button-variant-ghost'}" tl:href="${page.href}" tl:attr="aria-current=${page.current ? 'page' : null}, aria-label=${'Page ' + page.label}" tl:text="${page.label}">1</a></li><li data-slot="pagination-item"><a tl:if="${next}" tl:href="${next}" data-slot="pagination-link" class="trellis-pagination-link trellis-pagination-next trellis-button trellis-button-variant-ghost trellis-button-size-default" aria-label="Next page"><span class="trellis-pagination-next-text">Next</span></a><span tl:unless="${next}" aria-disabled="true" class="trellis-pagination-next">Next</span></li></ul></nav>
</body></html>
