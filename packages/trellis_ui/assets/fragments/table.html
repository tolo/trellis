<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>table</title></head><body>
<div tl:fragment="table(caption, columns, rows, ...attrs)" data-slot="table-container" class="trellis-table-container" role="region" tabindex="0" tl:attr="aria-label=${caption} ?: 'Data table'">
<table data-slot="table" class="trellis-table" tl:attrs="${attrs}"><caption data-slot="table-caption" class="trellis-table-caption" tl:text="${caption} ?: 'Data table'">Data table</caption><thead tl:slot="header" data-slot="table-header" class="trellis-table-header"><tr data-slot="table-row" class="trellis-table-row"><th tl:if="${columns == null}" scope="col" data-slot="table-head" class="trellis-table-head">Name</th><th tl:each="column : ${columns}" scope="col" data-slot="table-head" class="trellis-table-head" tl:text="${column}">Column</th></tr></thead><tbody tl:each="row : ${rows}" tl:slot="row" data-slot="table-body" class="trellis-table-body"><tr data-slot="table-row" class="trellis-table-row"><td data-slot="table-cell" class="trellis-table-cell" tl:text="${row}">Value</td></tr></tbody><tfoot data-slot="table-footer" class="trellis-table-footer"><tr><td tl:slot="footer" data-slot="table-cell" class="trellis-table-cell"></td></tr></tfoot></table></div>
</body></html>
