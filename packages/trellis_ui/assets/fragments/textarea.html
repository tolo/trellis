<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>textarea</title></head><body>
<!-- A text-only textarea cannot contain an inner slot element, and a fragment root cannot itself be a slot. -->
<tl:block tl:fragment="textarea(...attrs)"><textarea data-slot="textarea" class="trellis-textarea" tl:attrs="${attrs}" tl:slot=""></textarea></tl:block>
</body></html>
