<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Toast</title></head><body>
<!-- htmx's beforeend OOB swap consumes the wrapper and inserts its children. -->
<div tl:fragment="toast(type, title, description, duration, outOfBand, ...attrs)"
  tl:attr="id=${outOfBand ? 'toaster' : null}, hx-swap-oob=${outOfBand ? 'beforeend' : null}"
  tl:remove="${outOfBand ? 'none' : 'tag'}">
  <tl-toast tl:attr="data-duration=${duration} ?: 5000">
    <div data-slot="toast" class="trellis-toast group/toast" tl:attrs="${attrs}"
      tl:with="type=${type == 'error' or type == 'success' or type == 'warning' ? type : 'info'}"
      tl:attr="data-type=${type}, role=${type == 'error' ? 'alert' : null}">
      <span class="trellis-toast-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <tl:block tl:if="${type == 'success'}"><circle cx="12" cy="12" r="10"></circle><path d="m16 9-5.5 5.5L8 12"></path></tl:block>
          <tl:block tl:if="${type == 'info'}"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></tl:block>
          <tl:block tl:if="${type == 'warning'}">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path>
          </tl:block>
          <tl:block tl:if="${type == 'error'}">
            <path d="m15 9-6 6"></path><path d="M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z"></path><path d="m9 9 6 6"></path>
          </tl:block>
        </svg>
      </span>
      <div class="trellis-toast-body">
        <div data-slot="toast-title" class="trellis-toast-title" tl:text="${title}">Notification</div>
        <div data-slot="toast-description" class="trellis-toast-description" tl:if="${description}" tl:text="${description}"></div>
      </div>
      <button type="button" aria-label="Dismiss notification" data-slot="toast-close" data-size="icon-sm"
        data-variant="ghost" class="trellis-button trellis-button-variant-ghost trellis-button-size-icon-sm group/button">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
  </tl-toast>
</div>

<div tl:fragment="toastViewport(id, ...attrs)" role="region" aria-label="Notifications" aria-live="polite"
  data-slot="toast-viewport" class="trellis-toaster" tl:attr="id=${id} ?: 'toaster'" tl:attrs="${attrs}">
  <tl:block tl:slot=""></tl:block>
</div>
</body></html>
