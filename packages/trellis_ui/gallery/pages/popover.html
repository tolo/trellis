<h1>Popover</h1>
<section id="demo">
  <a id="before" href="#after">Jump to after the example</a>
  <button id="outside" type="button" class="gallery-action">Outside the panel</button>
  <section id="component" aria-label="Popover example">
    <div tl:replace="~{trellis-ui/popover :: popover('options', 'bottom', 'start', 8)}">
      <span tl:slot="trigger">Options</span>
      <div tl:slot="content">
        <div tl:replace="~{trellis-ui/popover :: popoverHeader}">
          <h2 tl:replace="~{trellis-ui/popover :: popoverTitle}">Display options</h2>
          <p tl:replace="~{trellis-ui/popover :: popoverDescription}">Set the number of rows per page.</p>
        </div>
        <label for="page-size">Rows per page</label>
        <input tl:replace="~{trellis-ui/input :: input}" type="number" id="page-size" value="10" min="1">
      </div>
    </div>
  </section>
  <a id="after" href="#before">After example</a>
  <button id="swap" type="button" class="gallery-action" hx-get="/components/popover" hx-select="#demo"
    hx-target="#demo" hx-swap="outerHTML">Refresh example</button>
  <a id="navigate" class="gallery-action" hx-boost="true" href="/components/button">Next example</a>
</section>
