<h1>Toast</h1>
<section id="component" aria-label="Toast examples">
  <div id="demo">
    <a id="before" href="#after">Before example</a>
    <div class="gallery-row">
      <button id="toast-add" type="button" tl:replace="~{trellis-ui/button :: button('default', 'default')}"
        hx-get="/demo/toast" hx-swap="none">Show notification</button>
      <button id="toast-timed" type="button" tl:replace="~{trellis-ui/button :: button('outline', 'default')}"
        hx-get="/demo/toast?duration=5000" hx-swap="none">Show timed notification</button>
    </div>
    <a id="after" href="#before">After example</a>
    <button id="swap" type="button" class="gallery-action" hx-get="/components/toast"
      hx-select="#demo" hx-target="#demo" hx-swap="outerHTML">Refresh example</button>
    <a id="navigate" class="gallery-action" hx-boost="true" href="/components/button">Next example</a>
  </div>
  <div tl:replace="~{trellis-ui/toast :: toastViewport('toaster')}"></div>
</section>
