name: trellis_workspace
publish_to: none
environment:
  sdk: ^3.10.0
workspace:
  - packages/trellis
  - packages/trellis_shelf
  - packages/trellis_dev
  - packages/trellis_cli
  - packages/trellis_css
  - packages/trellis_site
  - packages/trellis_dart_frog
  - packages/trellis_relic
  - examples/shelf_app
  - examples/todo_app
  - examples/relic_app
  - examples/dart_frog_app
dev_dependencies:
  melos: ^7.4.0
  # For the docs-site link-integrity checker (tool/link_check.dart) and its test.
  # The workspace root is publish_to: none, so these are dev-only tooling deps,
  # not runtime dependencies of any published package. `html` is already resolved
  # in the workspace (trellis, trellis_css) — no new transitive dependency.
  html: ^0.15.6
  path: ^1.9.0
  test: ^1.25.0
  # SHA-256 for tool/build_release.dart artifact sidecars. Already resolved
  # transitively in the workspace — declared here so tool/ can import it.
  crypto: ^3.0.0

# Melos scripts require global activation to use `melos run <script>`:
#   dart pub global activate melos
# Alternative without global install (uses dart run melos exec directly):
#   dart run melos exec --dir-exists lib -- dart analyze --fatal-infos
#   dart run melos exec --dir-exists test --fail-fast --order-dependents -- dart test
melos:
  repository: https://github.com/tolo/trellis
  command:
    version:
      # Lockstep release policy (ADR-009): every publishable package shares ONE
      # version and is bumped together. Cut releases with tool/version_lockstep.sh,
      # which drives `melos version` with an explicit version for each package.
      # Melos rewrites dependents' constraints automatically in the same pass.
      branch: main
      workspaceChangelog: true
      linkToCommits: true
      message: |
        chore(release): trellis SDK {new_package_versions}
  scripts:
    analyze:
      description: Run static analysis across all packages
      exec: dart analyze --fatal-infos
      packageFilters:
        dirExists: lib
    test:
      description: Run tests in all packages
      run: dart test
      exec:
        failFast: true
        orderDependents: true
      packageFilters:
        dirExists: test
    format:check:
      description: Check formatting across all packages
      exec: dart format --output none --set-exit-if-changed .
