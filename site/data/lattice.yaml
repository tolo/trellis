# Site copy for the Lattice home layout; replaces themes/lattice/data/lattice.yaml
# as a whole. The *_html panes are pre-marked code, rendered with tl:utext —
# no client-side highlighter ships in an official theme (ADR-010).
code_showcase:
  title: Open it in a browser. Then render it.
  body: >-
    A Trellis template is valid HTML with tl:* attributes. Designers preview the file directly; the engine binds your
    data at render time.
  template_label: posts.html
  template_html: |-
    <span class="t-dim">&lt;</span><span class="t-tag">article</span> <span class="t-tl">tl:each</span>=<span class="t-str">"post : </span><span class="t-expr">${posts}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">h2</span> <span class="t-tl">tl:text</span>=<span class="t-str">"</span><span class="t-expr">${post.title}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>Title<span class="t-dim">&lt;/</span><span class="t-tag">h2</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">p</span> <span class="t-tl">tl:text</span>=<span class="t-str">"</span><span class="t-expr">${post.summary}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>Summary<span class="t-dim">&lt;/</span><span class="t-tag">p</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">a</span> <span class="t-tl">tl:href</span>=<span class="t-str">"@{/posts(id=</span><span class="t-expr">${post.id}</span><span class="t-str">)}"</span><span class="t-dim">&gt;</span>
        Read more<span class="t-dim">&lt;/</span><span class="t-tag">a</span><span class="t-dim">&gt;</span>
    <span class="t-dim">&lt;/</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>
  output_label: output
  output_html: |-
    <span class="t-dim">&lt;</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">h2</span><span class="t-dim">&gt;</span>Growing season<span class="t-dim">&lt;/</span><span class="t-tag">h2</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">p</span><span class="t-dim">&gt;</span>Server-rendered Dart, start to finish.<span class="t-dim">&lt;/</span><span class="t-tag">p</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">a</span> <span class="t-attr">href</span>=<span class="t-str">"/posts?id=42"</span><span class="t-dim">&gt;</span>Read more<span class="t-dim">&lt;/</span><span class="t-tag">a</span><span class="t-dim">&gt;</span>
    <span class="t-dim">&lt;/</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>
    <span class="t-dim">&lt;</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>…<span class="t-dim">&lt;/</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>
why:
  title: Why Trellis
  body: Use just the engine, or the whole trellis — composable packages that share one version and grow together.
  cells:
    - title: Natural HTML templates
      body: Templates are valid HTML. Browsers render them as prototypes and designers open them directly.
    - title: HTMX-first fragments
      body: tl:fragment and renderFragment() map directly to HTMX partial responses.
    - title: Pure-Dart toolchain
      body: HTML, Markdown, and SASS are Dart packages. No Node.js, no webpack.
    - title: Single-binary deploy
      body: dart compile exe produces one file with instant startup and tiny containers.
    - title: Static sites from Markdown
      body: Content, layouts, navigation, feeds, and search build together with the same pure-Dart toolchain.
    - title: Themes without forks
      body: Install a complete design, configure it in YAML, and keep the theme on its own update path.
demo:
  title: One file, two views
  body: >-
    Proof, not promise — the same posts.html is a clickable prototype on your desk and a live page in production.
  template_html: |-
    <span class="t-dim">&lt;</span><span class="t-tag">article</span> <span class="t-tl">tl:each</span>=<span class="t-str">"post : </span><span class="t-expr">${posts}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">h2</span> <span class="t-tl">tl:text</span>=<span class="t-str">"</span><span class="t-expr">${post.title}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>Title<span class="t-dim">&lt;/</span><span class="t-tag">h2</span><span class="t-dim">&gt;</span>
      <span class="t-dim">&lt;</span><span class="t-tag">p</span> <span class="t-tl">tl:text</span>=<span class="t-str">"</span><span class="t-expr">${post.summary}</span><span class="t-str">"</span><span class="t-dim">&gt;</span>Summary<span class="t-dim">&lt;/</span><span class="t-tag">p</span><span class="t-dim">&gt;</span>
    <span class="t-dim">&lt;/</span><span class="t-tag">article</span><span class="t-dim">&gt;</span>
  prototype_title: Title
  prototype_body: Summary
  rendered_title: Fragments over frameworks
  rendered_body: Why HTMX and server rendering beat a client bundle for most apps.
  rendered_posts:
    - title: Fragments over frameworks
      body: Why HTMX and server rendering beat a client bundle for most apps.
    - title: One binary, zero Node
      body: Deploying a Dart web app in a compact container image.
    - title: Templates you can open
      body: Prototyping pages with no server running at all.
site_demo:
  title: Markdown in. A complete site out.
  body: Write content once, then build themed HTML with navigation, search, feeds, and deploy-ready links.
  source_label: content/docs/getting-started.md
  markdown_html: |-
    <span class="t-dim">---</span>
    <span class="t-attr">title</span>: <span class="t-str">Getting Started</span>
    <span class="t-attr">weight</span>: <span class="t-expr">10</span>
    <span class="t-dim">---</span>

    <span class="t-dim">#</span> <span class="t-tag">Build a site</span>

    Create pages from Markdown, then publish the output anywhere.
  arrow_label: trellis build
  page_title: Build a site with Trellis
  page_body: Create pages from Markdown, apply a theme, and deploy the generated output anywhere.
showcase:
  title: Built-in themes, grown in the same garden
  body: Pick a design, set one line of configuration, and publish. Browse every installed design from Themes.
  link_label: All themes →
  link_url: /docs/themes/gallery/
  cards:
    - name: Arbor
      description: Documentation sites — sidebar navigation, in-page TOC, search, syntax highlighting.
      config: "theme: arbor"
      accent: green
      screenshot_light: themes/arbor/light.png
      screenshot_dark: themes/arbor/dark.png
      alt: Arbor documentation theme
    - name: Lattice
      description: Docs with a landing page — expressive home sections, complete docs navigation.
      config: "theme: lattice"
      accent: purple
      screenshot_light: themes/lattice/light.png
      screenshot_dark: themes/lattice/dark.png
      alt: Lattice documentation theme
    - name: Folio
      description: Field-guide docs — bookish typography, semantic figures, sidenotes.
      config: "theme: folio"
      accent: blue
      screenshot_light: themes/folio/light.png
      screenshot_dark: themes/folio/dark.png
      alt: Folio documentation theme
