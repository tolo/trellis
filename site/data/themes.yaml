themes:
  - name: "arbor"
    archetype: "docs"
    description: "A documentation theme for Trellis. Hierarchical sidebar navigation, in-page table of contents, prev/next links, and build-time syntax highlighting (the SSG bakes `.hljs-*` spans in — no highlighter JS shipped). Fully readable with JavaScript disabled."
    config_hint: "theme: arbor"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/arbor/README.md"
    screenshot_light: "themes/arbor/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/arbor/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
  - name: "bloom"
    archetype: "landing"
    description: "A bold landing/marketing page theme for products and apps"
    config_hint: "theme: bloom"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/bloom/README.md"
    screenshot_light: "themes/bloom/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/bloom/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
  - name: "folio"
    archetype: "docs"
    description: "A bookish field-guide documentation theme with semantic figures and sidenotes."
    config_hint: "theme: folio"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/folio/README.md"
    screenshot_light: "themes/folio/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/folio/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
  - name: "lattice"
    archetype: "docs"
    description: "A garden-inspired documentation theme with an expressive home page and complete docs navigation."
    config_hint: "theme: lattice"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/lattice/README.md"
    screenshot_light: "themes/lattice/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/lattice/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
  - name: "meadow"
    archetype: "landing"
    description: "A fresh, energetic product-landing theme with content-driven sections."
    config_hint: "theme: meadow"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/meadow/README.md"
    screenshot_light: "themes/meadow/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/meadow/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
  - name: "verdant"
    archetype: "blog"
    description: "A minimal, accessible blog theme for Trellis. Content-first design with three color skins, responsive layout, and full keyboard navigation."
    config_hint: "theme: verdant"
    readme_url: "https://github.com/tolo/trellis/tree/main/themes/verdant/README.md"
    screenshot_light: "themes/verdant/light.png"
    screenshot_light_source: "screenshots/light.png"
    screenshot_dark: "themes/verdant/dark.png"
    screenshot_dark_source: "screenshots/dark.png"
