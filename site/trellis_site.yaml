title: Trellis
description: >-
  A pure-Dart SDK for building server-rendered web applications and static sites — natural HTML templates,
  HTMX-first fragments, and a single-binary deploy.
baseUrl: https://tolo.github.io

# Live deploy target: GitHub Project Pages sub-path https://tolo.github.io/trellis/.
# The build prefixes every root-absolute internal link/asset with this value and
# writes files at unprefixed disk paths (output/docs/index.html), so the tree is
# deployable under /trellis/. Config-driven: moving to a custom root domain later
# is just clearing this to '' (and pointing baseUrl at the new host) — no code change.
pathPrefix: /trellis/

# site/ is a direct child of the repo root, so this normalized relative path
# resolves to the reusable Lattice theme without copying or forking it.
theme: ../../themes/lattice

theme_params:
  skin: auto
  logo: trellis-logo.png
  favicon: trellis-mark.png
  nav_links:
    - label: Docs
      url: /docs/
    - label: Packages
      url: /docs/packages/
    - label: Themes
      url: /docs/themes/gallery/
    - label: GitHub
      url: https://github.com/tolo/trellis
  footer_text: "Trellis — MIT licensed."
  social_links:
    - label: GitHub
      url: https://github.com/tolo/trellis
    - label: pub.dev
      url: https://pub.dev/packages/trellis
    - label: Docs
      url: /docs/
  show_powered_by: false
  show_rss_link: false
  show_sidebar: true
  show_toc: true
  show_prev_next: true
  show_search: true
  toc_title: On this page
  sidebar_title: Documentation
  excerpt_length: 160
  hero_eyebrow: Pure-Dart web SDK
  hero_headlines:
    - prefix: "Templates that are just HTML. A stack that's "
      emphasis: just Dart
      suffix: "."
    - prefix: "Grow web apps in "
      emphasis: pure Dart
      suffix: ". No Node required."
    - prefix: "Dart plus templates that are "
      emphasis: just HTML
      suffix: "."
    - prefix: "Valid HTML in. Server-rendered "
      emphasis: Dart
      suffix: " out."
    - prefix: "One language, one binary — "
      emphasis: the whole garden
      suffix: "."
  hero_lede: >-
    Trellis renders natural HTML templates — valid markup your browser opens as a prototype — and grows into a full
    SDK for server-rendered apps and static sites. HTMX-first fragments, no Node.js, and a single-binary deploy.
  hero_cta_primary_label: Get started
  hero_cta_primary_url: /docs/getting-started/
  hero_cta_secondary_label: Read the docs
  hero_cta_secondary_url: /docs/
  terminal_card_lines:
    - prefix: "$"
      text: dart pub add trellis
      kind: command
    - prefix: "+"
      text: trellis 0.11.0 — one dependency
      kind: output
    - prefix: "$"
      text: trellis create my_app && cd my_app
      kind: command
    - prefix: "+"
      text: "created Shelf + HTMX starter"
      kind: output
    - prefix: ">"
      text: dart run bin/server.dart -> :8080
      kind: output
  show_terminal_card: true
  show_code_showcase: true
  show_why_grid: true
  show_demo: true
  show_themes_showcase: true
  show_cta: true
  cta_title: One dependency away
  cta_body: Add the engine to any Dart project, or scaffold a full themed site with trellis_cli — planted in seconds.
  cta_commands:
    - dart pub add trellis
    - dart pub global activate trellis_cli

# Search (S09). Enabled: emits search-index.json consumed by the vendored
# client-side search script. `fields` lists the keys each index entry carries
# (plus `url`, always present); the client reads title + summary/content.
search:
  enabled: true
  fields: [title, summary, content]  # tags omitted — no content uses tags: front matter yet; re-add if that changes
