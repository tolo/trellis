title: Bloom
description: The calm note-taking app that grows with your ideas.
baseUrl: http://localhost:8080

# Theme resolution
# ----------------
# The build resolves a theme by joining <siteDir>/themes/<value>. This example
# lives inside the theme, so `themes/bloom` is a symlink pointing at the theme
# root (../.. relative to themes/). That gives a real directory chain that both
# the manifest loader and the template FileSystemLoader can resolve.
#
# To use Bloom from your own site instead, run `trellis theme add <bloom-url>`
# and set `theme: bloom` (a real themes/bloom/ directory).
theme: bloom

# Customize theme params here — all are optional (defaults from theme.yaml apply).
theme_params:
  skin: auto
  hero_align: split
  pill_badges: true
  nav_links:
    - label: Features
      url: "#features"
    - label: Pricing
      url: "#pricing"
    - label: FAQ
      url: "#faq"
    - label: Privacy
      url: /privacy/
  social_links:
    - platform: GitHub
      url: https://github.com/
      label: GitHub
    - platform: Mastodon
      url: https://mastodon.social/
      label: Mastodon
  footer_text: "© 2026 Bloom Labs"
  show_powered_by: true
