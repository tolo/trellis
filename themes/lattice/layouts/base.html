<!doctype html>
<html lang="en" tl:attr="data-skin=${theme.skin}">
  <head tl:with="assetBase=${site.pathPrefix} == '' ? '/' : ${site.pathPrefix}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title tl:text="${page.title} == ${site.title} ? ${site.title} : ${page.title} + ' — ' + ${site.title}">
      Page — Site
    </title>
    <meta name="description" tl:attr="content=${page.description} ?: ${page.summary} ?: ${site.description}" />
    <link rel="stylesheet" tl:attr="href=${assetBase} + 'css/main.css'" href="/css/main.css" />
    <link rel="stylesheet" tl:attr="href=${assetBase} + 'css/theme-props.css'" href="/css/theme-props.css" />
    <!-- assetBase already ends in a slash, so a root-relative value sheds its own
         leading slash first: plain concatenation emits //favicon.svg, which a browser
         reads as an authority and fetches from a host named favicon.svg. Same rule at
         every join in this theme. -->
    <link
      tl:with="faviconPath=${#strings.startsWith(theme.favicon, '/')}
        ? ${#strings.substring(theme.favicon, 1)} : ${theme.favicon}"
      rel="icon"
      tl:attr="href=${assetBase} + ${faviconPath}"
      href="/favicon.svg"
    />
    <link
      tl:if="${site.feeds.atom} and ${theme.show_rss_link}"
      rel="alternate"
      type="application/atom+xml"
      tl:attr="href=${site.feeds.atom}"
    />
    <script tl:if="${theme.skin} == 'auto'">
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("trellis-theme");
        } catch (_) {}
        saved = saved === "dark" || saved === "light" ? saved : null;
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <script tl:if="${theme.show_search}" tl:attr="src=${assetBase} + 'js/search.js'" defer></script>
    <script tl:attr="src=${assetBase} + 'js/lattice.js'" defer></script>
    <meta tl:define="head-extra" />
  </head>
  <body tl:with="assetBase=${site.pathPrefix} == '' ? '/' : ${site.pathPrefix}">
    <a class="skip-to-content" href="#main-content">Skip to content</a>
    <div class="background-lattice" aria-hidden="true">
      <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
        <g stroke="currentColor" stroke-width="1.25">
          <g transform="rotate(45 800 500)">
            <path
              d="M-600-450H2200 M-600-320H2200 M-600-190H2200 M-600-60H2200 M-600 70H2200
                 M-600 200H2200 M-600 330H2200 M-600 460H2200 M-600 590H2200 M-600 720H2200
                 M-600 850H2200 M-600 980H2200 M-600 1110H2200 M-600 1240H2200 M-600 1370H2200"
            />
          </g>
          <g transform="rotate(-45 800 500)">
            <path
              d="M-600-450H2200 M-600-320H2200 M-600-190H2200 M-600-60H2200 M-600 70H2200
                 M-600 200H2200 M-600 330H2200 M-600 460H2200 M-600 590H2200 M-600 720H2200
                 M-600 850H2200 M-600 980H2200 M-600 1110H2200 M-600 1240H2200 M-600 1370H2200"
            />
          </g>
        </g>
      </svg>
    </div>
    <header class="site-header" tl:define="site-header">
      <div class="wrap nav">
        <a class="wordmark" href="/" tl:href="${assetBase}" tl:attr="aria-label=${site.title} + ' home'">
          <img
            class="trellis-logo"
            tl:if="${theme.logo} != null and ${theme.logo} != ''"
            tl:with="logoPath=${#strings.startsWith(theme.logo, '/')}
              ? ${#strings.substring(theme.logo, 1)} : ${theme.logo}"
            tl:attr="src=${assetBase} + ${logoPath},alt=${site.title}"
            src="/trellis-logo.png"
            alt="Trellis"
          />
          <span tl:unless="${theme.logo} != null and ${theme.logo} != ''" tl:text="${site.title}">Site title</span>
        </a>
        <div class="nav-right">
          <nav class="desktop-nav" aria-label="Main navigation">
            <ul class="nav-links">
              <li tl:each="link : ${theme.nav_links}"><a tl:href="${link.url}" tl:text="${link.label}">Link</a></li>
            </ul>
          </nav>
          <details class="mobile-nav">
            <summary>Menu</summary>
            <nav aria-label="Mobile navigation">
              <ul>
                <li tl:each="link : ${theme.nav_links}">
                  <a tl:href="${link.url}" tl:text="${link.label}">Link</a>
                </li>
              </ul>
            </nav>
          </details>
          <!-- Rendered hidden; lattice.js reveals it. Without JavaScript the toggle cannot do
               anything, and the PRD's no-JS contract is "no skin toggle" — the media query applies. -->
          <button
            tl:if="${theme.skin} == 'auto'"
            class="mode-toggle"
            type="button"
            data-lattice-theme-toggle
            aria-label="Switch color mode"
            hidden
          >
            <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2" />
              <path
                d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" tabindex="-1" tl:define="content">
      <div class="wrap"><p>Override content.</p></div>

      <details class="sidebar-disclosure" open data-docs-sidebar tl:fragment="sidebar">
        <summary class="sidebar-toggle" tl:text="${theme.sidebar_title}">Documentation</summary>
        <div class="docs-sidebar">
          <!-- Ships hidden alongside the disabled input: search.js reveals the shell only once the
               index has loaded, so with JavaScript off no dead control renders at all. -->
          <div
            class="search-shell"
            hidden
            tl:if="${theme.show_search}"
            tl:with="assetBase=${site.pathPrefix} == '' ? '/' : ${site.pathPrefix}"
            tl:attr="data-search-index=${assetBase} + 'search-index.json'"
          >
            <label class="sr-only" for="lattice-docs-search">Search documentation</label>
            <input
              id="lattice-docs-search"
              class="search-input"
              type="search"
              placeholder="Search…"
              autocomplete="off"
              data-lattice-search
              disabled
            />
            <ul class="search-results" data-lattice-search-results aria-live="polite" hidden></ul>
          </div>
          <nav class="sidebar-nav" tl:attr="aria-label=${theme.sidebar_title}">
            <p class="sidebar-title" tl:text="${theme.sidebar_title}">Documentation</p>
            <ul class="sidebar-tree">
              <li class="sidebar-item" tl:each="n1 : ${site.menu}">
                <a
                  class="sidebar-link"
                  tl:if="${n1.url != ''}"
                  tl:href="${n1.url}"
                  tl:text="${n1.title}"
                  tl:classappend="${n1.url == page.url} ? 'is-active' : ''"
                  tl:attr="aria-current=${n1.url == page.url} ? 'page' : _"
                  >Page</a
                >
                <span class="sidebar-label" tl:unless="${n1.url != ''}" tl:text="${n1.title}">Section</span>
                <ul class="sidebar-subtree" tl:if="${#lists.size(n1.children)} > 0">
                  <li class="sidebar-item" tl:each="n2 : ${n1.children}">
                    <a
                      class="sidebar-link"
                      tl:if="${n2.url != ''}"
                      tl:href="${n2.url}"
                      tl:text="${n2.title}"
                      tl:classappend="${n2.url == page.url} ? 'is-active' : ''"
                      tl:attr="aria-current=${n2.url == page.url} ? 'page' : _"
                      >Page</a
                    >
                    <span class="sidebar-label" tl:unless="${n2.url != ''}" tl:text="${n2.title}">Section</span>
                    <ul class="sidebar-subtree" tl:if="${#lists.size(n2.children)} > 0">
                      <li class="sidebar-item" tl:each="n3 : ${n2.children}">
                        <a
                          class="sidebar-link"
                          tl:if="${n3.url != ''}"
                          tl:href="${n3.url}"
                          tl:text="${n3.title}"
                          tl:classappend="${n3.url == page.url} ? 'is-active' : ''"
                          tl:attr="aria-current=${n3.url == page.url} ? 'page' : _"
                          >Page</a
                        >
                        <span class="sidebar-label" tl:unless="${n3.url != ''}" tl:text="${n3.title}">Section</span>
                      </li>
                    </ul>
                  </li>
                </ul>
              </li>
            </ul>
          </nav>
        </div>
      </details>

      <aside class="docs-toc" tl:fragment="toc">
        <nav aria-label="Table of contents">
          <p class="toc-title" tl:text="${theme.toc_title}">On this page</p>
          <ul class="toc-list">
            <li tl:each="entry : ${page.toc}" tl:attr="class='toc-item toc-level-' + ${entry.level}">
              <a tl:href="'#' + ${entry.id}" tl:text="${entry.text}">Heading</a>
            </li>
          </ul>
        </nav>
      </aside>
    </main>

    <footer class="site-footer" tl:define="site-footer">
      <div class="wrap footer-inner">
        <p tl:if="${theme.footer_text != null} and ${theme.footer_text != ''}" tl:text="${theme.footer_text}">Footer</p>
        <ul class="social-links" tl:if="${#lists.size(theme.social_links)} > 0">
          <li tl:each="link : ${theme.social_links}">
            <a tl:href="${link.url}" tl:text="${link.label} ?: ${link.platform}" rel="noopener noreferrer">Social</a>
          </li>
        </ul>
        <p tl:if="${theme.show_powered_by}">Built with <a href="https://pub.dev/packages/trellis">Trellis</a></p>
      </div>
    </footer>
  </body>
</html>
