name: lattice
version: 1.0.0
author: Trellis Team
description: A garden-inspired documentation theme with an expressive home page and complete docs navigation.
min_trellis_version: 0.10.0
screenshots:
  - screenshots/light.png
  - screenshots/dark.png
features: [docs, dark-mode, responsive, accessible, syntax-highlighting, search]

params:
  # Standard params (18).
  skin: { type: enum, values: [light, dark, auto], default: auto, description: Color scheme }
  primary_color: { type: color, default: "#2E7D4F", description: Light-skin primary accent }
  accent_color: { type: color, default: "#6E9B45", description: Light-skin secondary accent }
  text_color: { type: color, default: "#1C2B21", description: Light-skin body text }
  muted_color: { type: color, default: "#47584C", description: Light-skin muted text }
  bg_color: { type: color, default: "#FBFAF5", description: Light-skin page background }
  surface_color: { type: color, default: "#FFFFFF", description: Light-skin surface background }
  border_color: { type: color, default: "#E7E3D4", description: Light-skin borders }
  font_family: { type: string, default: "Instrument Sans, -apple-system, sans-serif", description: Body font stack }
  heading_font_family: { type: string, default: "Fraunces, Georgia, serif", description: Heading font stack }
  code_font_family: { type: string, default: "Spline Sans Mono, ui-monospace, monospace", description: Code font stack }
  max_width: { type: string, default: "1056px", description: Maximum content width }
  border_radius: { type: string, default: "8px", description: Global corner radius }
  nav_links:
    type: list
    default: [{ label: Home, url: / }, { label: Docs, url: /docs/ }]
    description: Header navigation links
  social_links: { type: list, default: [], description: Footer social links }
  footer_text: { type: string, default: null, description: Optional footer text }
  show_powered_by: { type: boolean, default: true, description: Show Trellis attribution }
  show_rss_link: { type: boolean, default: true, description: Show feed discovery links }

  # Docs params (the Arbor contract).
  show_sidebar: { type: boolean, default: true, description: Show docs sidebar }
  show_toc: { type: boolean, default: true, description: Show page table of contents }
  show_prev_next: { type: boolean, default: true, description: Show previous and next links }
  show_search: { type: boolean, default: true, description: Show client-side docs search }
  toc_title: { type: string, default: "On this page", description: TOC title }
  sidebar_title: { type: string, default: "Documentation", description: Sidebar label }

  # Lattice params.
  excerpt_length: { type: int, default: 160, description: Plain-text generated-summary length }
  hero_eyebrow: { type: string, default: "Server-rendered Dart", description: Hero eyebrow }
  hero_headlines:
    type: list
    default:
      - { prefix: "Templates that are just HTML. A stack that's ", emphasis: "just Dart", suffix: "." }
      - { prefix: "Grow web apps in ", emphasis: "pure Dart", suffix: ". No Node required." }
    description: "Headline entries [{prefix, emphasis, suffix}]"
  hero_lede:
    {
      type: string,
      default: "Natural HTML templates for server-rendered Dart applications and static sites.",
      description: Hero introduction,
    }
  hero_cta_primary_label: { type: string, default: "Read the docs", description: Primary hero CTA label }
  hero_cta_primary_url: { type: string, default: "/docs/", description: Primary hero CTA URL }
  hero_cta_secondary_label: { type: string, default: "View on GitHub", description: Secondary hero CTA label }
  hero_cta_secondary_url:
    { type: string, default: "https://github.com/tolo/trellis", description: Secondary hero CTA URL }
  terminal_card_lines:
    {
      type: list,
      default: ["dart pub add trellis", "trellis create my_site", "trellis serve"],
      description: Hero terminal commands,
    }
  show_terminal_card: { type: boolean, default: true, description: Show hero terminal card }
  show_code_showcase: { type: boolean, default: true, description: Show code showcase }
  show_why_grid: { type: boolean, default: true, description: Show benefits grid }
  show_demo: { type: boolean, default: true, description: Show two-view demo }
  show_themes_showcase: { type: boolean, default: true, description: Show theme cards }
  show_cta: { type: boolean, default: true, description: Show closing CTA }
  cta_title: { type: string, default: "One dependency away", description: Closing CTA title }
  cta_body:
    {
      type: string,
      default: "Start with the engine or scaffold a complete themed site.",
      description: Closing CTA body,
    }
  cta_commands:
    {
      type: list,
      default: ["dart pub add trellis", "dart pub global activate trellis_cli"],
      description: Closing CTA commands,
    }
