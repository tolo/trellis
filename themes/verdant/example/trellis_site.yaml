title: Verdant Blog
description: A sample blog powered by Trellis and the Verdant theme.
baseUrl: http://localhost:4000

# Theme resolution
# ----------------
# The build resolves a theme by joining <siteDir>/themes/<value>. This example
# lives inside the theme, so `themes/verdant` is provided as a symlink pointing at
# the theme root (../.. relative to themes/). That gives a real directory chain
# that both the manifest loader and the template FileSystemLoader can resolve.
#
# To use Verdant from your own site instead, run `trellis theme add <verdant-url>`
# and set `theme: verdant` (a real themes/verdant/ directory).
theme: verdant

# Taxonomies to collect from front matter. `tags` generates the term pages
# (/tags/ and /tags/<slug>/) that the post tag pills link to; without it those
# pages are never built and the pills render nothing.
taxonomies:
  - tags

# Customize theme params here — all params are optional (defaults from theme.yaml apply)
theme_params:
  skin: auto
  show_reading_time: true
  show_date: true
  show_author: true
  show_tags: true
  nav_links:
    - label: Home
      url: /
    - label: Posts
      url: /posts/
    - label: About
      url: /about/
  footer_text: "Verdant — a Trellis blog theme."
  show_powered_by: true

# Pagination
paginate: 5
