<!DOCTYPE html>
<!-- Verdant Blog Theme — layouts/base.html
     Root layout: provides the full HTML shell, navigation, and footer.
     All other layouts extend this one via tl:extends="layouts/base.html".

     Trellis Patterns Used:
     - tl:define:    Creates named override blocks — child layouts fill these slots.
     - ${theme.*}:   Reads merged theme params (theme.yaml defaults + site theme_params:).
     - ${site.*}:    Reads site config values (title, baseUrl, description, feeds).
     - tl:if:        Conditional rendering — e.g., show_powered_by, show_rss_link.
     - tl:each:      Iterates over lists — nav_links, social_links.
     - tl:href/@{}: URL expressions for link href generation.
     - tl:text:      Sets element text content with HTML escaping.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: page title — child layouts override ${page.title} -->
  <title tl:text="${page.title} + ' — ' + ${site.title}">Page — Site</title>

  <!-- SEO: meta description from page front matter or site description -->
  <meta name="description"
        tl:attr="content=${page.description} ?: ${page.summary} ?: ${site.description}">

  <!-- Open Graph tags for social sharing -->
  <meta property="og:title" tl:attr="content=${page.title}">
  <meta property="og:description"
        tl:attr="content=${page.description} ?: ${page.summary} ?: ${site.description}">
  <meta property="og:type" content="website">
  <meta property="og:url" tl:attr="content=${site.baseUrl} + ${page.url}">

  <!-- Theme CSS — compiled from sass/main.scss by the Trellis CLI -->
  <link rel="stylesheet" href="/css/main.css">

  <!-- CSS custom properties for runtime overrides (generated by SASS bridge) -->
  <link rel="stylesheet" href="/css/theme-props.css">

  <!-- RSS/Atom feed link — controlled by show_rss_link param -->
  <link tl:if="${site.feeds.atom} and ${theme.show_rss_link}"
        rel="alternate" type="application/atom+xml"
        title="Atom Feed" tl:attr="href=${site.feeds.atom}">
  <link tl:if="${site.feeds.rss} and ${theme.show_rss_link}"
        rel="alternate" type="application/rss+xml"
        title="RSS Feed" tl:attr="href=${site.feeds.rss}">

  <!-- Syntax highlighting via Prism.js (CDN) — controlled by syntax_highlighting param.
       Only the JS is loaded; token colors are provided by the theme's _code.scss. -->
  <script tl:if="${theme.syntax_highlighting}"
          src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
  <script tl:if="${theme.syntax_highlighting}"
          src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"
          defer></script>

  <!-- Extra head slot: child layouts or site override can inject additional tags -->
  <meta tl:define="head-extra">
</head>
<body>

  <!-- Accessibility: skip-to-content link — visually hidden until focused.
       Allows keyboard users to bypass the navigation. -->
  <a href="#main-content" class="skip-to-content">Skip to content</a>

  <!-- Site header with navigation -->
  <header class="site-header" tl:define="site-header">
    <div class="container">
      <a href="/" class="site-title" tl:text="${site.title}">Site Title</a>

      <!-- Navigation from theme.nav_links param — customize in theme_params: -->
      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li tl:each="link : ${theme.nav_links}">
            <a tl:href="${link.url}" tl:text="${link.label}">Link</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main content area — child layouts define this slot -->
  <main id="main-content" class="main-content" tl:define="content">
    <div class="container">
      <p>Override the "content" slot in a child layout.</p>
    </div>
  </main>

  <!-- Site footer -->
  <footer class="site-footer" tl:define="site-footer">
    <div class="container">
      <div class="footer-inner">

        <!-- Social links from theme.social_links param -->
        <ul class="social-links" tl:if="${theme.social_links}">
          <li tl:each="link : ${theme.social_links}">
            <a tl:href="${link.url}"
               tl:text="${link.label} ?: ${link.platform}"
               rel="noopener noreferrer"
               target="_blank">Social</a>
          </li>
        </ul>

        <!-- Footer text: custom or generated -->
        <p class="footer-text" tl:if="${theme.footer_text}" tl:text="${theme.footer_text}">
          Custom footer text
        </p>

        <!-- Powered-by attribution — disable with show_powered_by: false -->
        <p class="powered-by" tl:if="${theme.show_powered_by}">
          Built with <a href="https://pub.dev/packages/trellis">Trellis</a>
        </p>
      </div>
    </div>
  </footer>

</body>
</html>
